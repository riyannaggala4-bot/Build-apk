name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release Asset URL"
        required: true
        type: string

      tag:
        description: "Release tag"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write
  actions: read

concurrency:
  group: flutter-build-${{ github.run_id }}
  cancel-in-progress: true

jobs:

  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    timeout-minutes: 40

    env:
      BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Builder
        uses: actions/checkout@v4

      # =========================================================
      # 2. SYSTEM INFORMATION
      # =========================================================

      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "SYSTEM INFORMATION"
          echo "=========================================="

          echo
          echo "OS:"
          uname -a

          echo
          echo "Java:"
          java -version 2>&1 || true

          echo
          echo "Gradle:"
          gradle --version 2>/dev/null || true

          echo
          echo "Disk:"
          df -h

          echo
          echo "Memory:"
          free -h || true

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # 4. FLUTTER STABLE
      # =========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================================================
      # 5. FLUTTER INFORMATION
      # =========================================================

      - name: Flutter Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FLUTTER INFORMATION"
          echo "=========================================="

          echo
          echo "Flutter:"
          flutter --version

          echo
          echo "Dart:"
          dart --version

          echo
          echo "Flutter Doctor:"
          flutter doctor -v || true

      # =========================================================
      # 6. PREPARE WORKSPACE
      # =========================================================

      - name: Prepare Workspace
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/input"
          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/input"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          echo "Workspace ready."

      # =========================================================
      # 7. DOWNLOAD PROJECT ZIP
      # =========================================================

      - name: Download Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_URL="${{ inputs.zip_url }}"

          echo "=========================================="
          echo "DOWNLOAD PROJECT"
          echo "=========================================="

          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: zip_url kosong."
            exit 1
          fi

          if [ -z "$BUILD_TOKEN" ]; then
            echo "ERROR: BUILD_TOKEN belum tersedia."
            echo
            echo "Tambahkan:"
            echo "Settings"
            echo "-> Secrets and variables"
            echo "-> Actions"
            echo "-> New repository secret"
            echo
            echo "Name:"
            echo "BUILD_TOKEN"

            exit 1
          fi

          echo "Downloading ZIP..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer $BUILD_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            --output "$GITHUB_WORKSPACE/input/project.zip"

          if [ ! -s "$GITHUB_WORKSPACE/input/project.zip" ]; then
            echo "ERROR: ZIP kosong."
            exit 1
          fi

          echo
          echo "Download berhasil:"
          ls -lh "$GITHUB_WORKSPACE/input/project.zip"

      # =========================================================
      # 8. VALIDATE ZIP
      # =========================================================

      - name: Validate ZIP
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/input/project.zip"

          echo "=========================================="
          echo "VALIDATE ZIP"
          echo "=========================================="

          unzip -t "$ZIP" >/dev/null

          echo "ZIP valid."

      # =========================================================
      # 9. EXTRACT PROJECT
      # =========================================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/input/project.zip"
          OUT="$GITHUB_WORKSPACE/extracted"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "Extracting..."

          unzip -q "$ZIP" -d "$OUT"

          echo
          echo "Extract selesai."

          echo
          echo "Project files:"
          find "$OUT" \
            -maxdepth 3 \
            -type f \
            | head -150

      # =========================================================
      # 10. DETECT FLUTTER PROJECT
      # =========================================================

      - name: Detect Flutter Project
        shell: bash
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/extracted"

          echo "=========================================="
          echo "DETECT FLUTTER PROJECT"
          echo "=========================================="

          PUBSPEC=$(find "$ROOT" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/build/*" \
            -not -path "*/.dart_tool/*" \
            | head -1)

          if [ -z "$PUBSPEC" ]; then

            echo
            echo "ERROR: pubspec.yaml tidak ditemukan."

            echo
            echo "Isi ZIP:"
            find "$ROOT" \
              -maxdepth 5 \
              -type f \
              | head -250

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo
          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" \
            > "$GITHUB_WORKSPACE/project_dir.txt"

      # =========================================================
      # 11. INSPECT PROJECT
      # =========================================================

      - name: Inspect Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT INFORMATION"
          echo "=========================================="

          echo
          echo "Directory:"
          pwd

          echo
          echo "Files:"
          ls -la

          echo
          echo "pubspec.yaml:"
          sed -n '1,250p' pubspec.yaml

      # =========================================================
      # 12. PREPARE ANDROID
      # =========================================================

      - name: Prepare Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PREPARE ANDROID"
          echo "=========================================="

          if [ ! -d "android" ]; then

            echo "Android directory tidak ditemukan."
            echo "Generating Android project..."

            flutter create \
              --platforms=android \
              --project-name=build_apk_temp \
              .

          else

            echo "Android directory ditemukan."

          fi

          # -----------------------------------------------------
          # Pastikan Gradle Wrapper tersedia
          # -----------------------------------------------------

          if [ ! -f "android/gradlew" ]; then

            echo
            echo "gradlew tidak ditemukan."
            echo "Regenerating Android files..."

            flutter create \
              --platforms=android \
              --project-name=build_apk_temp \
              .

          fi

          if [ ! -f "android/gradlew" ]; then
            echo
            echo "ERROR: android/gradlew tetap tidak ditemukan."
            exit 1
          fi

          chmod +x android/gradlew

          echo
          echo "Android structure:"
          find android \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

      # =========================================================
      # 13. FIX AGP 9 / NEW DSL
      # =========================================================

      - name: Fix Flutter AGP 9 Compatibility
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "AGP 9 COMPATIBILITY"
          echo "=========================================="

          mkdir -p android

          touch android/gradle.properties

          # -----------------------------------------------------
          # ANDROID NEW DSL
          # -----------------------------------------------------

          if grep -q "^android.newDsl=" android/gradle.properties; then

            sed -i \
              's/^android.newDsl=.*/android.newDsl=false/' \
              android/gradle.properties

          else

            echo "android.newDsl=false" \
              >> android/gradle.properties

          fi

          # -----------------------------------------------------
          # BUILT-IN KOTLIN
          # -----------------------------------------------------

          if grep -q "^android.builtInKotlin=" android/gradle.properties; then

            sed -i \
              's/^android.builtInKotlin=.*/android.builtInKotlin=false/' \
              android/gradle.properties

          else

            echo "android.builtInKotlin=false" \
              >> android/gradle.properties

          fi

          # -----------------------------------------------------
          # GRADLE JVM
          # -----------------------------------------------------

          if grep -q "^org.gradle.jvmargs=" android/gradle.properties; then

            sed -i \
              's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8|' \
              android/gradle.properties

          else

            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
              >> android/gradle.properties

          fi

          # -----------------------------------------------------
          # GRADLE PERFORMANCE
          # -----------------------------------------------------

          if ! grep -q "^org.gradle.daemon=" android/gradle.properties; then
            echo "org.gradle.daemon=true" \
              >> android/gradle.properties
          fi

          if ! grep -q "^org.gradle.parallel=" android/gradle.properties; then
            echo "org.gradle.parallel=true" \
              >> android/gradle.properties
          fi

          if ! grep -q "^org.gradle.caching=" android/gradle.properties; then
            echo "org.gradle.caching=true" \
              >> android/gradle.properties
          fi

          echo
          echo "=========================================="
          echo "FINAL gradle.properties"
          echo "=========================================="

          cat android/gradle.properties

      # =========================================================
      # 14. GRADLE PERMISSIONS
      # =========================================================

      - name: Fix Gradle Permissions
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          chmod +x android/gradlew

          echo "Gradle executable permission OK."

      # =========================================================
      # 15. FLUTTER CLEAN
      # =========================================================

      - name: Flutter Clean
        shell: bash
        run: |
          set +e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          flutter clean

          exit 0

      # =========================================================
      # 16. FLUTTER PUB GET
      # =========================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          echo
          echo "Dependencies berhasil."

      # =========================================================
      # 17. FLUTTER ANALYZE
      # =========================================================

      - name: Flutter Analyze
        continue-on-error: true
        shell: bash
        run: |
          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "FLUTTER ANALYZE"
          echo "=========================================="

          echo "[RESULT_ANALYZE]"

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            || true

          echo "[END_RESULT_ANALYZE]"

      # =========================================================
      # 18. DETECT BUILD TYPE
      # =========================================================

      - name: Detect Build Configuration
        shell: bash
        run: |
          set -e

          BUILD_TYPE="${{ inputs.build_type }}"

          if [ "$BUILD_TYPE" != "debug" ] && \
             [ "$BUILD_TYPE" != "release" ]; then

            BUILD_TYPE="release"

          fi

          echo "BUILD_TYPE=$BUILD_TYPE" \
            >> "$GITHUB_ENV"

          echo
          echo "Build type:"
          echo "$BUILD_TYPE"

      # =========================================================
      # 19. VALIDATE GRADLE
      # =========================================================

      - name: Validate Android Gradle
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE VALIDATION"
          echo "=========================================="

          if [ ! -f "android/gradlew" ]; then

            echo "ERROR: android/gradlew tidak ada."

            exit 1

          fi

          chmod +x android/gradlew

          cd android

          ./gradlew --version

      # =========================================================
      # 20. BUILD APK - FIRST ATTEMPT
      # =========================================================

      - name: Build APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD APK"
          echo "=========================================="

          echo
          echo "Flutter:"
          flutter --version

          echo
          echo "Build type:"
          echo "$BUILD_TYPE"

          echo
          echo "Starting build..."

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-pub \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/build.log"

          else

            flutter build apk \
              --release \
              --no-pub \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/build.log"

          fi

      # =========================================================
      # 21. RETRY BUILD
      # =========================================================

      - name: Retry APK Build
        if: steps.build_apk.outcome == 'failure'
        id: retry_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "RETRY APK BUILD"
          echo "=========================================="

          echo
          echo "First build gagal."
          echo "Melakukan clean dan retry..."

          # -----------------------------------------------------
          # CLEAN
          # -----------------------------------------------------

          flutter clean || true

          rm -rf build
          rm -rf android/.gradle

          # Jangan hapus pub cache global.
          # Itu akan membuat build jauh lebih lambat.

          echo
          echo "Reinstall dependencies..."

          flutter pub get

          # -----------------------------------------------------
          # RE-APPLY AGP FIX
          # -----------------------------------------------------

          touch android/gradle.properties

          if grep -q "^android.newDsl=" android/gradle.properties; then

            sed -i \
              's/^android.newDsl=.*/android.newDsl=false/' \
              android/gradle.properties

          else

            echo "android.newDsl=false" \
              >> android/gradle.properties

          fi

          if grep -q "^android.builtInKotlin=" android/gradle.properties; then

            sed -i \
              's/^android.builtInKotlin=.*/android.builtInKotlin=false/' \
              android/gradle.properties

          else

            echo "android.builtInKotlin=false" \
              >> android/gradle.properties

          fi

          chmod +x android/gradlew

          echo
          echo "Retry build..."

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --no-pub \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/build-retry.log"

          else

            flutter build apk \
              --release \
              --no-pub \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/build-retry.log"

          fi

      # =========================================================
      # 22. CHECK BUILD RESULT
      # =========================================================

      - name: Check Build Result
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECK BUILD RESULT"
          echo "=========================================="

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          APK=""

          # -----------------------------------------------------
          # STANDARD FLUTTER APK PATH
          # -----------------------------------------------------

          if [ -d "$PROJECT_DIR/build/app/outputs/apk" ]; then

            APK=$(find \
              "$PROJECT_DIR/build/app/outputs/apk" \
              -type f \
              -name "*.apk" \
              | sort \
              | head -1)

          fi

          # -----------------------------------------------------
          # FALLBACK SEARCH
          # -----------------------------------------------------

          if [ -z "$APK" ]; then

            APK=$(find \
              "$PROJECT_DIR/build" \
              -type f \
              -name "*.apk" \
              2>/dev/null \
              | sort \
              | head -1)

          fi

          # -----------------------------------------------------
          # APK NOT FOUND
          # -----------------------------------------------------

          if [ -z "$APK" ]; then

            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "APK tidak ditemukan."

            echo
            echo "Build directory:"
            find "$PROJECT_DIR/build" \
              -maxdepth 10 \
              -type f \
              2>/dev/null \
              | head -400

            exit 1

          fi

          echo
          echo "=========================================="
          echo "APK FOUND"
          echo "=========================================="

          echo
          echo "Path:"
          echo "$APK"

          echo
          echo "Size:"
          du -h "$APK"

          # -----------------------------------------------------
          # COPY APK
          # -----------------------------------------------------

          cp "$APK" \
            "$GITHUB_WORKSPACE/flutter-${BUILD_TYPE}.apk"

          echo
          echo "Copied to:"
          echo "$GITHUB_WORKSPACE/flutter-${BUILD_TYPE}.apk"

      # =========================================================
      # 23. VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/flutter-${BUILD_TYPE}.apk"

          echo "=========================================="
          echo "VERIFY APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            exit 1

          fi

          if [ ! -s "$APK" ]; then

            echo "ERROR: APK kosong."

            exit 1

          fi

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "File:"
          file "$APK" || true

          echo
          echo "SHA256:"
          sha256sum "$APK"

      # =========================================================
      # 24. UPLOAD APK ARTIFACT
      # =========================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ github.workspace }}/flutter-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # 25. BUILD SUMMARY
      # =========================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="

          echo
          echo "Repository:"
          echo "${{ github.repository }}"

          echo
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo
          echo "Run ID:"
          echo "${{ github.run_id }}"

          echo
          echo "Build type:"
          echo "${BUILD_TYPE:-unknown}"

          echo
          echo "Flutter:"
          flutter --version || true

          echo
          echo "Project:"
          if [ -f "$GITHUB_WORKSPACE/project_dir.txt" ]; then
            cat "$GITHUB_WORKSPACE/project_dir.txt"
          fi

          echo
          echo "Generated APK:"
          ls -lh "$GITHUB_WORKSPACE"/*.apk 2>/dev/null || true

      # =========================================================
      # 26. UPLOAD LOGS WHEN FAILED
      # =========================================================

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/build.log
            ${{ github.workspace }}/build-retry.log
          if-no-files-found: ignore
          retention-days: 7

      # =========================================================
      # 27. FINAL RESULT
      # =========================================================

      - name: Final Result
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL RESULT"
          echo "=========================================="

          APK_FOUND=false

          if ls "$GITHUB_WORKSPACE"/*.apk >/dev/null 2>&1; then
            APK_FOUND=true
          fi

          if [ "$APK_FOUND" = "true" ]; then

            echo
            echo "=========================================="
            echo "BUILD SUCCESS"
            echo "=========================================="

            echo
            echo "APK berhasil dibuat:"

            ls -lh "$GITHUB_WORKSPACE"/*.apk

            echo
            echo "Build type:"
            echo "$BUILD_TYPE"

            exit 0

          else

            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "APK tidak berhasil dibuat."

            exit 1

          fi
