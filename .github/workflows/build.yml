name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub Release Asset API URL"
        required: true
        type: string

      tag:
        description: "Build Tag"
        required: true
        type: string

      build_type:
        description: "Build Type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:

  build:

    name: Build Flutter APK

    runs-on: ubuntu-latest

    timeout-minutes: 40

    env:
      ZIP_URL: ${{ github.event.inputs.zip_url }}
      BUILD_TAG: ${{ github.event.inputs.tag }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}

    steps:

      # ============================================================
      # 1. RUNNER INFORMATION
      # ============================================================

      - name: Runner Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       FLUTTER APK BUILD SYSTEM"
          echo "=========================================="

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Tag        : $BUILD_TAG"
          echo "Build Type : $BUILD_TYPE"

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Memory:"
          free -h || true


      # ============================================================
      # 2. SETUP FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # 3. FLUTTER VERSION
      # ============================================================

      - name: Check Flutter
        shell: bash
        run: |
          set -e

          echo "Flutter version:"
          flutter --version

          echo
          echo "Dart version:"
          dart --version


      # ============================================================
      # 4. DOWNLOAD ZIP
      # ============================================================

      - name: Download Flutter Project
        shell: bash
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING FLUTTER PROJECT"
          echo "=========================================="

          mkdir -p "$GITHUB_WORKSPACE/input"
          mkdir -p "$GITHUB_WORKSPACE/project"

          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: zip_url kosong."
            exit 1
          fi

          if [ -z "$BUILD_TOKEN" ]; then
            echo
            echo "ERROR: BUILD_TOKEN belum dibuat."
            echo
            echo "Buat:"
            echo "Repository Settings"
            echo "-> Secrets and variables"
            echo "-> Actions"
            echo "-> New repository secret"
            echo
            echo "Name:"
            echo "BUILD_TOKEN"
            exit 1
          fi

          echo "Tag  : $BUILD_TAG"
          echo "Mode : $BUILD_TYPE"
          echo
          echo "Downloading GitHub Release Asset..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $BUILD_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            --output "$GITHUB_WORKSPACE/input/project.zip"

          echo
          echo "Download selesai."

          if [ ! -f "$GITHUB_WORKSPACE/input/project.zip" ]; then
            echo "ERROR: project.zip tidak ditemukan."
            exit 1
          fi

          if [ ! -s "$GITHUB_WORKSPACE/input/project.zip" ]; then
            echo "ERROR: project.zip kosong."
            exit 1
          fi

          echo
          echo "ZIP size:"
          du -h "$GITHUB_WORKSPACE/input/project.zip"


      # ============================================================
      # 5. VALIDATE ZIP
      # ============================================================

      - name: Validate ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING ZIP"
          echo "=========================================="

          ZIP="$GITHUB_WORKSPACE/input/project.zip"

          unzip -t "$ZIP" > /dev/null

          echo "ZIP valid."


      # ============================================================
      # 6. EXTRACT PROJECT
      # ============================================================

      - name: Extract Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/project"

          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q \
            "$GITHUB_WORKSPACE/input/project.zip" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Extract selesai."

          echo
          echo "Mencari pubspec.yaml..."

          PUBSPEC=$(find \
            "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then

            echo
            echo "ERROR: pubspec.yaml tidak ditemukan."
            echo
            echo "Isi project:"
            
            find \
              "$GITHUB_WORKSPACE/project" \
              -maxdepth 4 \
              -type f \
              | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo
          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" \
            > "$GITHUB_WORKSPACE/project_dir.txt"


      # ============================================================
      # 7. PROJECT VALIDATION
      # ============================================================

      - name: Validate Flutter Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATING FLUTTER PROJECT"
          echo "=========================================="

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml tidak ada."
            exit 1
          fi

          echo
          echo "Project:"
          pwd

          echo
          echo "Files:"
          ls -la

          echo
          echo "pubspec.yaml:"
          sed -n '1,200p' pubspec.yaml


      # ============================================================
      # 8. PUB GET
      # ============================================================

      - name: Flutter Pub Get
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

          echo
          echo "Dependencies berhasil."


      # ============================================================
      # 9. ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: bash
        run: |

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "FLUTTER ANALYZE"
          echo "=========================================="

          echo "[RESULT_ANALYZE]"

          set +e

          flutter analyze --no-fatal-infos 2>&1

          ANALYZE_EXIT=$?

          set -e

          echo "[END_RESULT_ANALYZE]"

          echo
          echo "Analyze exit code: $ANALYZE_EXIT"

          # Tidak menghentikan build.
          # Error compile akan ditangani oleh flutter build apk.


      # ============================================================
      # 10. CHECK ANDROID PROJECT
      # ============================================================

      - name: Prepare Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PREPARING ANDROID"
          echo "=========================================="

          if [ ! -d "android" ]; then

            echo "Folder android tidak ditemukan."

            echo
            echo "Membuat Android project..."

            flutter create \
              --platforms=android \
              .

          fi

          if [ ! -d "android" ]; then
            echo "ERROR: Folder android gagal dibuat."
            exit 1
          fi

          echo
          echo "Android project siap."


      # ============================================================
      # 11. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING FLUTTER APK"
          echo "=========================================="

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then

            echo
            echo "Building DEBUG APK..."

            flutter build apk \
              --debug \
              --no-pub

          else

            echo
            echo "Building RELEASE APK..."

            flutter build apk \
              --release \
              --no-pub

          fi

          echo
          echo "Flutter build selesai."


      # ============================================================
      # 12. FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat "$GITHUB_WORKSPACE/project_dir.txt")

          echo "=========================================="
          echo "SEARCHING APK"
          echo "=========================================="

          APK=$(find \
            "$PROJECT_DIR/build" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo
            echo "ERROR: APK tidak ditemukan."

            echo
            echo "Build files:"

            find \
              "$PROJECT_DIR/build" \
              -type f \
              | head -200

            exit 1
          fi

          echo
          echo "APK ditemukan:"
          echo "$APK"

          echo
          echo "APK size:"
          du -h "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          OUTPUT="$GITHUB_WORKSPACE/output/app-${BUILD_TYPE}-${BUILD_TAG}.apk"

          cp "$APK" "$OUTPUT"

          echo
          echo "Output:"
          echo "$OUTPUT"

          echo "APK_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"


      # ============================================================
      # 13. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          if [ ! -f "$APK_OUTPUT" ]; then
            echo "ERROR: APK output tidak ada."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK_OUTPUT")

          echo "APK bytes: $SIZE"

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: APK terlalu kecil."
            exit 1
          fi

          file "$APK_OUTPUT" || true

          echo
          echo "APK verification OK."


      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 1


      # ============================================================
      # 15. BUILD SUCCESS
      # ============================================================

      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "          BUILD SUCCESS"
          echo "=========================================="

          echo
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Tag        : $BUILD_TAG"
          echo "Build Type : $BUILD_TYPE"

          echo
          echo "APK:"
          ls -lh "$APK_OUTPUT"

          echo
          echo "Artifact:"
          echo "flutter-apk"

          echo
          echo "=========================================="
          echo "BUILD SELESAI"
          echo "=========================================="


      # ============================================================
      # 16. BUILD FAILURE
      # ============================================================

      - name: Build Failure Info
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "             BUILD FAILED"
          echo "=========================================="

          echo
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Tag        : $BUILD_TAG"
          echo "Build Type : $BUILD_TYPE"

          echo
          echo "Project directory:"

          if [ -f "$GITHUB_WORKSPACE/project_dir.txt" ]; then
            cat "$GITHUB_WORKSPACE/project_dir.txt"
          else
            echo "Belum ditemukan."
          fi

          echo
          echo "=========================================="
          echo "Gagal mengambil / membangun project."
          echo "Lihat step yang bertanda merah."
          echo "=========================================="
